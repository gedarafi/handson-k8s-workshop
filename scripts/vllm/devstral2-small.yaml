apiVersion: apps/v1
kind: Deployment
metadata:
  name: devstral2-small
  namespace: mimer-aif-hackathon
  labels:
    app: devstral2-small
spec:
  replicas: 4
  selector:
    matchLabels:
      app: devstral2-small
  template:
    metadata:
      labels:
        app: devstral2-small
    spec:
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: model-storage
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "20Gi"
      nodeSelector:
        accelerator: nvidia-h100
      containers:
      - name: devstral2-small
        image: vllm/vllm-openai:latest
        command: ["/bin/sh", "-c"]
        args: ["vllm serve mistralai/Devstral-Small-2-24B-Instruct-2512 --max-model-len 262144 --tool-call-parser mistral --kv-cache-dtype fp8 --enable-auto-tool-choice --port 8080 --tensor-parallel-size 2"]   
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "6"
            memory: 24G
            nvidia.com/gpu: "2"
          requests:
            cpu: "6"
            memory: 24G
            nvidia.com/gpu: "2"
        volumeMounts:
        - mountPath: /shared/models/
          name: cache-volume
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 300
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 300
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devstral2-small
  namespace: mimer-aif-hackathon
spec:
  selector:
    app: devstral2-small
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devstral2-small
  namespace: mimer-aif-hackathon
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: mimer-aif-hackathon.icedc.se
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: devstral2-small
            port:
              number: 80
